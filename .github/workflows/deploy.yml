name: deploy

# Manual, gated deploy of the telegram-bot edge function FROM GitHub — so deploys need
# no local machine while keeping a human in the loop (you click "Run workflow"). This
# runs ONLY on manual dispatch — never on push/PR — so the access token is never exposed
# to fork pull requests on a public repo. See CLAUDE.md (a human runs every deploy).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   — from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF    — your project ref
# The bot's five function secrets live on Supabase (set once by setup.ts) — a code
# deploy never touches them.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm you want to deploy to production.'
        required: true
        default: ""
      project_ref:
        description: 'Target Supabase project ref (optional; defaults to the SUPABASE_PROJECT_REF repo secret). Lets one bot per couple self-deploy to its own project.'
        required: false
        default: ""
      function_name:
        description: 'Which edge function to deploy: telegram-bot (the single-tenant bot), telegram-bot-saas (the multi-tenant service), or stripe-billing (the multi-tenant service Stripe webhook + claim route).'
        required: false
        default: "telegram-bot"
        type: choice
        options:
          - telegram-bot
          - telegram-bot-saas
          - stripe-billing

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Resolve target function
        env:
          INPUT_FUNCTION: ${{ github.event.inputs.function_name }}
        run: |
          set -euo pipefail
          fn="${INPUT_FUNCTION:-telegram-bot}"
          # Allowlist: the deploy step interpolates this into a CLI call, and only these
          # three functions exist in the repo.
          case "$fn" in
            telegram-bot|telegram-bot-saas|stripe-billing) : ;;
            *) echo "FAIL: unknown function '$fn'"; exit 1 ;;
          esac
          echo "FUNCTION_NAME=$fn" >> "$GITHUB_ENV"
          echo "Deploying function: $fn"

      # esm.sh has 522'd three times in one afternoon, and a failed import fails the
      # gate. Restoring DENO_DIR means a run only reaches the network when deno.lock
      # changes, so a transient CDN outage no longer blocks a deploy. Integrity is still
      # enforced -- deno.lock carries the hashes, so a poisoned cache is rejected rather
      # than trusted.
      - name: Cache Deno modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Pre-deploy sanity gate
        run: bash ./predeploy-check.sh "$FUNCTION_NAME"

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Resolve the deploy target: the dispatch input (a couple's bot passes its own
      # ref) or, when empty, the repo's default SUPABASE_PROJECT_REF secret (unchanged
      # single-project behavior). If the DEPLOY_ALLOWED_REFS repo variable is set
      # (comma-separated), the target must be a member — a guard so a leaked deploy
      # token can't dispatch a deploy to an arbitrary project. Unset => no allowlist.
      - name: Resolve target project ref
        env:
          INPUT_REF: ${{ github.event.inputs.project_ref }}
          DEFAULT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ALLOWED_REFS: ${{ vars.DEPLOY_ALLOWED_REFS }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$DEFAULT_REF}"
          if [ -z "$ref" ]; then echo "FAIL: no target ref (input empty and SUPABASE_PROJECT_REF unset)"; exit 1; fi
          if [ -n "${ALLOWED_REFS:-}" ]; then
            case ",${ALLOWED_REFS//[[:space:]]/}," in
              *",$ref,"*) : ;;
              *) echo "FAIL: target ref is not in DEPLOY_ALLOWED_REFS"; exit 1 ;;
            esac
          fi
          # Don't echo the ref itself (parity with the masked secret); the deploy step prints the dashboard URL.
          echo "TARGET_REF=$ref" >> "$GITHUB_ENV"
          echo "Resolved deploy target."

      - name: Verify BUILD_VERSION was bumped
        run: |
          set -euo pipefail
          file_ver=$(sed -n 's/.*const BUILD_VERSION = "\([^"]*\)".*/\1/p' "supabase/functions/$FUNCTION_NAME/index.ts" | head -1)
          if [ -z "$file_ver" ]; then echo "FAIL: could not find BUILD_VERSION in index.ts"; exit 1; fi
          # Fetch live version from health endpoint (gracefully skipped on first deploy)
          live_json=$(curl -fsS "https://${TARGET_REF}.supabase.co/functions/v1/${FUNCTION_NAME}?health" 2>/dev/null || echo '{}')
          live_ver=$(echo "$live_json" | grep -o '"version":"[^"]*"' | head -1 | sed 's/"version":"//;s/"//')
          if [ -z "$live_ver" ]; then
            echo "Health endpoint unreachable (first deploy?). Skipping version bump check."
          elif [ "$file_ver" = "$live_ver" ]; then
            echo "FAIL: BUILD_VERSION ('$file_ver') matches the live version. Bump BUILD_VERSION before deploying."
            exit 1
          else
            echo "Version check passed: deploying '$file_ver' (live is '$live_ver')."
          fi

      - name: Deploy the function (committed file only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$TARGET_REF" --no-verify-jwt

      - name: Smoke-test the health route
        run: |
          set -euo pipefail
          ref="$TARGET_REF"
          ver=$(sed -n 's/.*const BUILD_VERSION = "\([^"]*\)".*/\1/p' "supabase/functions/$FUNCTION_NAME/index.ts" | head -1)
          body=$(curl -fsS "https://${ref}.supabase.co/functions/v1/${FUNCTION_NAME}?health")
          echo "health: $body"
          echo "$body" | grep -q "\"version\":\"${ver}\"" || { echo "FAIL: live version != ${ver}"; exit 1; }
          # Beyond the version, assert the secrets that decide whether this build can do
          # its job at all. A function that boots but is missing them looks healthy and
          # silently fails on first real use, which is exactly what a smoke test is for.
          # The flags differ per function, so the assertion does too.
          case "$FUNCTION_NAME" in
            telegram-bot|telegram-bot-saas)
              echo "$body" | grep -q '"adminConfigured":true' \
                || { echo "FAIL: adminConfigured not true"; exit 1; }
              echo "Smoke test passed: version ${ver}, adminConfigured true."
              ;;
            stripe-billing)
              # Without these the claim route cannot verify a payment and the webhook
              # cannot authenticate Stripe -- so a customer who has paid gets nothing.
              echo "$body" | grep -q '"stripeConfigured":true' \
                || { echo "FAIL: stripeConfigured not true (STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET)"; exit 1; }
              echo "$body" | grep -q '"botUsernameConfigured":true' \
                || { echo "FAIL: botUsernameConfigured not true (TELEGRAM_BOT_USERNAME)"; exit 1; }
              echo "$body" | grep -q '"pricesConfigured":true' \
                || { echo "FAIL: pricesConfigured not true (STRIPE_PRICE_STANDARD / STRIPE_PRICE_HEAVY)"; exit 1; }
              echo "Smoke test passed: version ${ver}, Stripe fully configured."
              ;;
          esac
